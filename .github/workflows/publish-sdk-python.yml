name: Publish Python SDK

on:
     push:
          tags:
               - "sdk-python-v*"

permissions:
     contents: read

defaults:
     run:
          working-directory: apps/SDK/Python-SDK

jobs:
     publish:
          name: Verify & publish to PyPI
          runs-on: ubuntu-latest

          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Set up Python
                 uses: actions/setup-python@v5
                 with:
                      # 3.11+ needed for the stdlib tomllib used in the version check below.
                      python-version: "3.11"

               - name: Install build tooling
                 run: python -m pip install --upgrade pip build twine

               - name: Verify tag matches pyproject.toml version
                 run: |
                      TAG_VERSION="${GITHUB_REF_NAME#sdk-python-v}"
                      PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
                      if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                        echo "Tag version ($TAG_VERSION) != pyproject.toml version ($PKG_VERSION)" >&2
                        exit 1
                      fi
                      echo "Publishing version $PKG_VERSION"

               - name: Build distributions
                 run: python -m build

               - name: Check distribution metadata
                 run: python -m twine check dist/*

               # NOTE: this package has no test suite (no pytest config, no tests/ dir).
               # Until one exists, the pre-publish gate installs the built wheel into a
               # clean venv and imports it, which catches syntax errors, packaging
               # mistakes and missing dependencies. Add `pytest` here once tests land.
               - name: Verify built wheel imports
                 run: |
                      python -m venv /tmp/verify-venv
                      /tmp/verify-venv/bin/pip install --upgrade pip
                      /tmp/verify-venv/bin/pip install dist/*.whl
                      /tmp/verify-venv/bin/python -c "
                      import keybox_sdk
                      expected = [
                          'activate_license',
                          'check_license_status',
                          'start_license_daemon',
                          'stop_license_daemon',
                          'get_license_state',
                          'LicenseState',
                      ]
                      missing = [n for n in expected if not hasattr(keybox_sdk, n)]
                      if missing:
                          raise SystemExit('Missing exports: ' + ', '.join(missing))
                      print('Import OK, all expected exports present.')
                      "

               - name: Publish to PyPI
                 run: python -m twine upload dist/*
                 env:
                      TWINE_USERNAME: __token__
                      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
