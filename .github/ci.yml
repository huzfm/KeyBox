name: Turbo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Turbo test
        run: npx turbo run test --filter=@app/server

      - name: Turbo build
        run: npx turbo run build --filter=@app/server

      - name: Deploy
        if: success()
        run: |
          echo "Deploy server"
