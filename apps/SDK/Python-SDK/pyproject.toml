[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keybox-sdk"
version = "0.1.3"
description = "Keybox licensing SDK for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name="Keybox", email="support@keybox.dev" }
]

dependencies = [
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/your-org/keybox-sdk"

# Exclude smoke tests from the published package
[tool.setuptools.packages.find]
exclude = ["__smoke__*"]

[tool.setuptools.package-data]
"*" = []
